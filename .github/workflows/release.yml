name: Publish Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Test
        run: dotnet test StatsInfo.sln --configuration Release /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura /p:Threshold=90 /p:ThresholdType=line /p:ThresholdStat=total

      - name: Publish self-contained Windows app
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Release tag must use vMAJOR.MINOR.PATCH, for example v1.0.0." }
          dotnet publish src\StatsInfo\StatsInfo.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true "-p:Version=$version" --output artifacts\publish\win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\StatsInfo.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "artifacts\installer\StatsInfo-Setup-$version.exe" "artifacts\installer\StatsInfo-Setup.exe"

      - name: Verify packaged settings and responsive overlay
        shell: pwsh
        run: |
          $qaDirectory = Join-Path $PWD 'artifacts\qa\release-smoke'
          $app = Start-Process -FilePath 'artifacts\publish\win-x64\StatsInfo.exe' -ArgumentList "--smoke-test `"$qaDirectory`"" -WindowStyle Hidden -PassThru
          if (-not $app.WaitForExit(60000)) { $app.Kill(); throw 'Packaged app verification timed out.' }
          if ($app.ExitCode -ne 0 -or -not (Test-Path "$qaDirectory\smoke-test.json")) {
            if (Test-Path "$qaDirectory\smoke-test-error.txt") { Get-Content "$qaDirectory\smoke-test-error.txt" }
            throw 'Packaged app verification failed.'
          }

      - name: Keep package verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-app-verification
          path: artifacts/qa/release-smoke

      - name: Package portable download
        shell: pwsh
        run: Compress-Archive -Path artifacts\publish\win-x64\* -DestinationPath artifacts\installer\StatsInfo-Portable-win-x64.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" artifacts\installer\StatsInfo-Setup.exe artifacts\installer\StatsInfo-Portable-win-x64.zip --title "StatsInfo $($env:GITHUB_REF_NAME.TrimStart('v'))" --generate-notes
